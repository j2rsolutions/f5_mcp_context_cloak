[project]
name = "context-cloak-mcp-server"
version = "0.1.0"
description = "MCP server exposing customer data tools for the Context Cloak POC"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
