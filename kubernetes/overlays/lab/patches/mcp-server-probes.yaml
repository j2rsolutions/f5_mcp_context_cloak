apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: context-cloak
spec:
  template:
    spec:
      containers:
        - name: mcp-server
          readinessProbe:
            httpGet: null
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: null
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
