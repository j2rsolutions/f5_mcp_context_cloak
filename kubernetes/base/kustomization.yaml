apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: context-cloak

resources:
  - namespace.yaml
  # Postgres
  - postgres/secret.yaml
  - postgres/configmap.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  # MCP Server
  - mcp-server/secret.yaml
  - mcp-server/configmap.yaml
  - mcp-server/deployment.yaml
  - mcp-server/service.yaml
  # Seed Job
  - seed-job.yaml
  # Network Policies
  - network-policies.yaml

# ---------------------------------------------------------------
# Optional: F5 AI Guardrails (Part 2 / Guardrails Mode)
# ---------------------------------------------------------------
# The guardrails component lives in its own namespace and ships a
# reference stub for demo reproducibility. Deploy independently:
#   kubectl apply -k kubernetes/base/guardrails
# Do NOT add it to the resources list above -- it uses a different
# namespace than the rest of this kustomization.

commonLabels:
  app.kubernetes.io/part-of: context-cloak
